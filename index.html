<!doctype html>
<html lang="en">

<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Lifeloop</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
<style>
/* Layout: one centred column. Header card with level and stats, a capture bar that stays on every tab, segmented tabs, then the active view. */
:root{
  color-scheme:dark;
  --page:#121b25; --page-a:#0e1721; --page-b:#182737; --bg:#1d2b39; --bg2:#243546; --bd:#2f4356; --tabon:#34495f; --spot:rgba(255,255,255,.06); --sweep:rgba(14,23,33,.55); --glow:rgba(229,177,58,.12);
  --fg:#e6ecf2; --ti:#ffffff; --mu:#a3b1bf;
  --gr:#3fd07a; --grs:#27ae60; --rd:#ff6b5f; --rds:#e23939; --bl:#4d8dff;
  --gold1:#ffe08a; --gold2:#e5b13a; --gold3:#b27d12; --goldtxt:#e9b84a;
  --edge:rgba(255,255,255,.34); --edge-in:rgba(255,255,255,.28); --edge-a:rgba(255,255,255,.42);
  --sh:0 8px 32px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08);
  --ff:"DM Sans",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fd:"Bricolage Grotesque","DM Sans",Inter,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --page:#e8edf2; --page-a:#f5f8fb; --page-b:#d8e1eb; --bg:#ffffff; --bg2:#f2f5f8; --bd:#e1e5e9; --tabon:#ffffff; --spot:rgba(22,82,240,.07); --sweep:rgba(245,248,251,.6); --glow:rgba(229,177,58,.22);
    --fg:#1d2b39; --ti:#0b1620; --mu:#647282;
    --gr:#1e8e4e; --rd:#d12f2f; --bl:#1652f0; --goldtxt:#9a6a05;
    --edge:rgba(0,0,0,.26); --edge-in:rgba(0,0,0,.26); --edge-a:rgba(0,0,0,.36);
    --sh:0 8px 32px rgba(16,32,48,.12),0 0 0 1px rgba(16,32,48,.08);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#e8edf2; --page-a:#f5f8fb; --page-b:#d8e1eb; --bg:#ffffff; --bg2:#f2f5f8; --bd:#e1e5e9; --tabon:#ffffff; --spot:rgba(22,82,240,.07); --sweep:rgba(245,248,251,.6); --glow:rgba(229,177,58,.22);
  --fg:#1d2b39; --ti:#0b1620; --mu:#647282;
  --gr:#1e8e4e; --rd:#d12f2f; --bl:#1652f0; --goldtxt:#9a6a05;
  --edge:rgba(0,0,0,.26); --edge-in:rgba(0,0,0,.26); --edge-a:rgba(0,0,0,.36);
  --sh:0 8px 32px rgba(16,32,48,.12),0 0 0 1px rgba(16,32,48,.08);
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(820px 440px at 10% -8%,var(--glow),transparent 65%) fixed,linear-gradient(160deg,var(--page-a),var(--page-b)) fixed;background-color:var(--page-b);color:var(--fg);font:500 14px/1.5 var(--ff);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--fg);background:var(--bg2);border:1px solid transparent;border-radius:10px;padding:9px 11px;outline:none;width:100%;min-width:0;transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--mu)}
textarea{resize:vertical;min-height:64px;line-height:1.45}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--bg);border-radius:24px;box-shadow:var(--sh)}
.lbl{font-size:12.5px;font-weight:600;color:var(--mu)}
.mu{color:var(--mu)}
.gx{font-style:normal;background:linear-gradient(135deg,var(--gold1),var(--gold2) 55%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}

/* header */
.hd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px}
.hr1{display:flex;align-items:center;gap:10px}
.ttl{display:flex;align-items:center;gap:10px;font:700 24px/1 var(--fd);letter-spacing:-.02em;color:var(--ti)}
.ttl svg{transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.ttl:hover svg{transform:rotate(-14deg) scale(1.1)}
.ttl svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.sp{flex:1}
.ib{width:30px;height:30px;border-radius:9px;color:var(--mu);display:grid;place-items:center;transition:background .12s,color .12s,transform .1s}
.ib:hover{background:var(--bg2);color:var(--fg)}
.ib:active{transform:scale(.92)}
.lvl{display:flex;align-items:center;gap:12px}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 10px;border-radius:999px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.pill.gold{color:var(--goldtxt);border-color:var(--goldtxt)}
.bar{position:relative;height:8px;border-radius:999px;background:var(--bg2);border:1px solid var(--bd);flex:1;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--grs);min-width:2px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.gold>i{background:linear-gradient(90deg,var(--gold1),var(--gold2) 60%,var(--gold3))}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strip div{background:var(--bg2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip b{font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--ti);white-space:nowrap}
.strip small{font-size:11px;color:var(--mu)}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.pulse{animation:pulse .5s ease}

/* chunky keycap buttons */
.k{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--bg2);color:var(--ti);font-size:13px;font-weight:700;padding:10px 15px;border-radius:10px;box-shadow:0 3px 0 var(--edge);transition:transform .1s ease,box-shadow .1s ease,filter .12s;white-space:nowrap}
.k:hover{transform:translateY(2px);box-shadow:0 1px 0 var(--edge),inset 0 3px 8px var(--edge-in)}
.k:active{transform:translateY(3px);box-shadow:inset 0 3px 10px var(--edge-a)}
.k:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.k.go{background:var(--grs);color:#fff;--edge:#176f3d;--edge-in:rgba(0,0,0,.28);--edge-a:rgba(0,0,0,.38)}
.k.go:hover:not(:disabled){filter:brightness(1.07)}
.k.sm{padding:6px 11px;font-size:12px;border-radius:9px;box-shadow:0 2px 0 var(--edge)}
.k.sm:hover{transform:translateY(1px);box-shadow:0 1px 0 var(--edge),inset 0 2px 6px var(--edge-in)}
.k.sm:active{transform:translateY(2px)}
.k.danger{color:var(--rd)}
.k.on{background:var(--ti);color:var(--bg)}

/* capture bar */
.cap{padding:14px;display:flex;flex-direction:column;gap:10px}
.caprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.caprow input{flex:1 1 220px;font-size:15px;padding:12px 14px;border-radius:12px}
.caphint{font-size:11.5px;color:var(--mu);min-height:17px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.caphint kbd{font:600 10.5px var(--ff);background:var(--bg2);border-radius:5px;padding:1px 6px}

/* tabs */
.tabs{position:relative;display:flex;padding:3px;gap:2px;background:var(--bg2);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;z-index:1;flex:1 0 auto;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:600;color:var(--mu);white-space:nowrap;transition:background .12s,color .12s,box-shadow .12s;display:flex;gap:6px;justify-content:center;align-items:center}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--ti)}
.tabind{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:9px;background:var(--tabon);box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .38s cubic-bezier(.3,1.25,.4,1),width .38s cubic-bezier(.3,1.25,.4,1);pointer-events:none;z-index:0}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vin{animation:vin .28s ease}
.tab em{font-style:normal;font-size:10.5px;font-weight:700;background:var(--bg2);color:var(--mu);border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.tab.on em{background:var(--grs);color:#fff}

/* view */
#view{padding:18px;display:flex;flex-direction:column;gap:20px}
.sec{display:flex;flex-direction:column;gap:8px}
.sech{display:flex;align-items:center;gap:8px;justify-content:space-between}
.empty{border:1px dashed var(--bd);border-radius:12px;padding:16px;color:var(--mu);font-size:12.5px;line-height:1.5}
.hello{display:flex;flex-direction:column;gap:8px}
.hello h2{font:700 28px/1.12 var(--fd);letter-spacing:-.02em;color:var(--ti)}
.strip b,.stats b,.bal b,.gcard h3,.rcard h3,.dlg h3{font-family:var(--fd)}
@keyframes pop2{0%{transform:scale(.55)}55%{transform:scale(1.28)}100%{transform:scale(1)}}
.row.just .chk.on{animation:pop2 .45s ease}

/* rows */
.row{display:flex;align-items:center;gap:11px;background:var(--bg2);border-radius:12px;padding:9px 10px 9px 11px;border:1px solid transparent;transition:border-color .12s,transform .12s}
.row:hover{border-color:var(--bd)}
.row.big{padding:13px 12px 13px 13px;border-radius:14px}
.row.big .tt{font-size:15px;font-weight:600}
.row.donerow .tt{text-decoration:line-through;color:var(--mu)}
@keyframes flash{0%{background:rgba(39,174,96,.35)}100%{background:var(--bg2)}}
.row.just{animation:flash .9s ease}
.chk{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;color:transparent;transition:transform .12s,border-color .12s,background .12s,color .12s}
.chk:hover{border-color:var(--gr);transform:scale(1.1);color:var(--gr)}
.chk:active{transform:scale(.9)}
.chk.on{background:var(--grs);border-color:var(--grs);color:#fff}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tt{text-align:left;color:var(--ti);font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.tt:hover{text-decoration:underline;text-decoration-color:var(--bd);text-underline-offset:3px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--mu)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;color:var(--mu);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:block}
.xp{font-size:11px;font-weight:700;color:var(--goldtxt)}
.ra{display:flex;gap:2px;align-items:center;flex:0 0 auto}
@media (hover:hover){.row .ra .ib.hov{opacity:0}.row:hover .ra .ib.hov,.row:focus-within .ra .ib.hov{opacity:1}}

/* habit chips on Today */
.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:8px;background:var(--bg2);border-radius:999px;padding:7px 13px 7px 9px;font-weight:600;font-size:12.5px;color:var(--ti);box-shadow:0 3px 0 var(--edge);transition:transform .1s ease,box-shadow .1s ease}
.hchip:hover{transform:translateY(2px);box-shadow:0 1px 0 var(--edge),inset 0 3px 8px var(--edge-in)}
.hchip:active{transform:translateY(3px);box-shadow:inset 0 3px 10px var(--edge-a)}
.hchip .chk{width:20px;height:20px;border-width:2px;pointer-events:none}
.hchip.on{background:var(--grs);color:#fff;--edge:#176f3d;--edge-in:rgba(0,0,0,.28);--edge-a:rgba(0,0,0,.38)}
.hchip.on .chk{background:#fff;border-color:#fff;color:var(--grs)}
.hchip small{font-size:11px;opacity:.8}

/* goals */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.gcard{background:var(--bg2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gcard h3{font-size:14.5px;font-weight:700;color:var(--ti);overflow-wrap:anywhere;text-align:left}
.gcard .bar{flex:none;background:var(--bg)}
.gsteps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:10px;padding:7px 8px}
.step .chk{width:20px;height:20px}
.step span{flex:1;min-width:0;overflow-wrap:anywhere;font-size:12.5px}
.step.d span{color:var(--mu);text-decoration:line-through}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form input[type=text],.form input:not([type]){flex:1 1 160px}
.form select{flex:0 1 150px}
.form input[type=number]{flex:0 1 90px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0;display:none}
.form input[type=date]{flex:0 1 150px}

/* habits */
.hrow{background:var(--bg2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hrow .nm{flex:1 1 150px;min-width:0;display:flex;flex-direction:column;gap:3px}
.days{display:flex;gap:5px}
.day{width:28px;height:36px;border-radius:9px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;font-weight:700;color:var(--mu);letter-spacing:.04em;transition:transform .1s,background .12s}
.day:hover{transform:translateY(-1px);background:var(--bd)}
.day b{width:12px;height:12px;border-radius:50%;border:2px solid var(--bd);display:block}
.day.on b{background:var(--grs);border-color:var(--grs)}
.day.today{outline:1px solid var(--mu)}
.day.off{opacity:.3}
.day.half b{border-color:var(--gold2)}
.streak{display:inline-flex;gap:4px;align-items:center;font-weight:700;font-size:12px;color:var(--goldtxt)}

/* rewards */
.bal{display:flex;flex-direction:column;gap:2px;background:var(--bg2);border-radius:14px;padding:16px}
.bal b{font-size:34px;line-height:1.1;letter-spacing:-.02em}
.rcard{background:var(--bg2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rcard h3{font-size:14px;font-weight:700;color:var(--ti);overflow-wrap:anywhere;text-align:left}
.rcard .bar{flex:none;background:var(--bg)}

/* review */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stats div{background:var(--bg2);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:20px;color:var(--ti);letter-spacing:-.01em}
.stats div:last-child:nth-child(odd){grid-column:1/-1}
.abar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;font-size:12.5px}
.abar .bar{background:var(--bg2);flex:none}
.abar .bar i{opacity:.95}
.abar span:last-child{text-align:right;color:var(--mu);font-weight:600}
.win{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.win:last-child{border:0}
.win span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.fld{display:flex;flex-direction:column;gap:6px}
.fld[hidden]{display:none}
details>summary{list-style:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--mu);display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'';width:7px;height:7px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);transition:transform .15s}
details[open]>summary::after{transform:rotate(-135deg)}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--bd);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--mu)}
.banner span{flex:1 1 220px}

/* modal + toast + pop */
.ov{position:fixed;inset:0;background:rgba(5,10,16,.55);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
.ov[hidden]{display:none}
.dlg{background:var(--bg);border-radius:20px;box-shadow:var(--sh);width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{font-size:16px;color:var(--ti)}
.dlg .fld>label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
.dact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:60;padding:0 16px}
.toast{background:var(--ti);color:var(--bg);font-weight:600;font-size:12.5px;padding:9px 14px;border-radius:999px;box-shadow:var(--sh);animation:tin .25s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{position:fixed;z-index:70;pointer-events:none;font-weight:800;font-size:15px;color:var(--gold2);text-shadow:0 1px 6px rgba(0,0,0,.35);animation:pop .9s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%) scale(1.15)}}
/* spotlight, ring, filters, drag, heatmap, confetti, theme sweep */
.row,.gcard,.rcard,.hrow,.bal,.strip div,.stats div{background-image:radial-gradient(220px circle at var(--mx,-400px) var(--my,-400px),var(--spot),transparent 70%)}
.hell{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.htxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.ring{flex:0 0 auto;position:relative;width:60px;height:60px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--ti)}
.ring .trk{stroke:var(--bg2)}
.ring .val{stroke:var(--grs);transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fc{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--bg2);color:var(--mu);transition:background .12s,color .12s,transform .1s}
.fc i{width:7px;height:7px;border-radius:50%;display:block}
.fc:hover{color:var(--fg);transform:translateY(-1px)}
.fc.on{background:var(--ti);color:var(--bg)}
.row[draggable=true]{cursor:grab}
.row.dragging{opacity:.4}
.row.over{border-color:var(--gr);transform:translateY(2px)}
.heat{display:grid;grid-template-rows:repeat(7,20px);grid-auto-flow:column;grid-auto-columns:20px;gap:4px;justify-content:start;max-width:100%;overflow-x:auto;padding-bottom:2px}
.hc{display:block;width:20px;height:20px;border-radius:5px;background:var(--bg2);min-width:0}

html body.ot-celestial:not(.ot-synth):not(.ot-horizon) .side .scol{order:3;margin-top:0 !important}
html body.ot-celestial:not(.ot-synth):not(.ot-horizon) .side.col::after{display:none}
@media (max-width:900px){html body.ot-celestial:not(.ot-synth):not(.ot-horizon) .side.col::after{display:block}}
@media (max-height:640px){html body.ot-celestial:not(.ot-synth):not(.ot-horizon) .side::after{display:none}}
/* notes v2 + nutrition score + playlists + even widths */
.ntblocks{position:relative;padding-left:16px}
.nb{position:relative}
.nb-dg{position:absolute;left:-17px;top:2px;width:17px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px;line-height:1;cursor:grab;opacity:0;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:6px;letter-spacing:-2px;transition:opacity .12s}
.nb:hover>.nb-dg,.nb:focus-within>.nb-dg{opacity:.75}
@media(hover:none){.nb-dg{opacity:.38}}
.nb-dg:active{cursor:grabbing;opacity:1}
.nb.dragging{opacity:.3}
body.nt-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.nt-ghost{position:fixed;z-index:99999;pointer-events:none;background:var(--bg2);color:var(--ti);border:1px solid var(--gold2);border-radius:10px;padding:6px 12px;max-width:70vw;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nt-drop{position:absolute;left:0;right:0;height:3px;background:var(--gold2);border-radius:2px;pointer-events:none;z-index:5;box-shadow:0 0 8px var(--gold2)}
.ntanim{animation:ntin .2s ease both}
@keyframes ntin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nb.nb-img,.nb.nb-tblw,.nb.nb-colsw,.nb.nb-toc{display:block}
.nb-img{margin:10px 0}
.nb-img figure{margin:0;text-align:center}
.nb-img img{display:block;max-width:100%;height:auto;border-radius:12px;margin:0 auto;border:1px solid var(--bd)}
.nb-cap{font-size:.85em;color:var(--mu);text-align:center;padding:6px 4px;outline:none;min-height:1.4em}
.nb-cap:empty::before{content:attr(data-ph);opacity:.55}
.nbtools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.nb-tblw,.nb-colsw{margin:10px 0}
.nbtw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.nb-tbl{border-collapse:collapse;width:100%;table-layout:fixed;min-width:max-content}
.nb-tbl td{border:1px solid var(--bd);padding:7px 9px;min-width:90px;vertical-align:top;word-break:break-word;outline:none}
.nb-tbl tr:first-child td{font-weight:700;background:var(--bg2)}
.nb-tbl td:focus{background:color-mix(in srgb,var(--gold2) 12%,transparent);box-shadow:inset 0 0 0 1.5px var(--gold2)}
.nb-cols{display:flex;gap:10px}
.nb-col{flex:1;min-width:0;border:1px dashed var(--bd);border-radius:10px;padding:8px 10px;min-height:44px;outline:none;word-break:break-word}
.nb-col:focus{border-style:solid;border-color:var(--gold2)}
.nb-col:empty::before{content:attr(data-ph);opacity:.5}
.nb-toc{margin:8px 0;position:relative}
.nbtocb{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--bd)}
.nbtoc{text-align:left;padding:4px 6px;border-radius:8px;color:var(--ti);font-size:.95em}
.nbtoc:hover{background:color-mix(in srgb,var(--gold2) 14%,transparent)}
.nbtoc.l2{padding-left:18px}.nbtoc.l3{padding-left:32px;opacity:.85}
.nbtocx{position:absolute;right:6px;top:6px}
.nb-x a[data-pg],.ntlnk{color:var(--gold2);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer;font-weight:600}
.ntbl{margin-top:16px;padding-top:10px;border-top:1px solid var(--bd)}
.ntbl h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.ntinsq{width:100%;box-sizing:border-box;height:40px;border-radius:12px;background:var(--bg2);color:var(--ti);border:1px solid var(--bd);padding:0 12px;margin:2px 0 8px;font-size:15px}
.ntopt[hidden]{display:none}
/* nutrition score */
.nusc{display:flex;align-items:center;gap:14px;margin:6px 0 8px}
.nusn{width:76px;height:76px;border-radius:50%;border:5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.nusn b{font:800 26px/1 var(--fd)}.nusn span{font-size:10px;opacity:.7}
.nusx{display:flex;flex-direction:column;gap:2px}.nusx b{font:700 17px var(--fd);color:var(--ti)}
.nuok{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.nuokc{font-size:12px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,#22c55e 16%,transparent);color:#22c55e}
.nutips{display:flex;flex-direction:column;gap:8px}
.nutip{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:12px;background:var(--bg2);border-left:3px solid #ef4444;font-size:13.5px;line-height:1.4}
.nutip b{color:var(--ti)}.nutip i{font-style:normal;font-weight:700;color:var(--mu)}
/* playlists */
.plcard{display:flex;flex-direction:column;gap:10px}
.plform{display:flex;flex-direction:column;gap:8px}
.plform input{height:42px;border-radius:12px;background:var(--bg2);color:var(--ti);border:1px solid var(--bd);padding:0 12px;font-size:15px;min-width:0}
.pllist{display:flex;flex-direction:column;gap:8px}
.plrow{display:flex;align-items:center;gap:8px}
.plgo{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--bd);color:var(--ti);text-decoration:none}
.plgo:hover{border-color:var(--gold2)}
.plpl{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:#1a1405;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.plgo .nun{min-width:0}.plgo .nun b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* even widths: every section uses the same width, so nothing jumps */
body .shell>.wrap,body.app-trade .shell>.wrap,body.app-cal .shell>.wrap,body.app-gym .shell>.wrap,body.app-study .shell>.wrap,body.app-tools .shell>.wrap,body.app-nutri .shell>.wrap,body.app-notes .shell>.wrap{max-width:1000px}
/* notes editing dock (redesign) */
.ntbar2{--ntac:#f43f5e;position:fixed;left:8px;right:8px;bottom:0;margin:0 auto calc(10px + env(safe-area-inset-bottom));width:max-content;max-width:calc(100vw - 16px);z-index:80;display:flex;align-items:center;gap:2px;padding:6px;border-radius:20px;background:color-mix(in srgb,var(--bg) 95%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--ntac) 70%,transparent);box-shadow:0 14px 36px rgba(0,0,0,.4),0 0 18px color-mix(in srgb,var(--ntac) 18%,transparent);animation:ntbin .18s ease both}
@keyframes ntbin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ntbar2[hidden]{display:none}
@media(max-width:760px){.ntbar2{overflow-x:auto;scrollbar-width:none;justify-content:flex-start}.ntbar2::-webkit-scrollbar{display:none}}
.ntbar2 .ntg{display:flex;align-items:center;gap:2px;padding-right:6px;margin-right:4px;border-right:1px solid color-mix(in srgb,var(--ntac) 30%,transparent);flex:none}
.ntbar2 .ntg:last-child{border:0;margin:0;padding:0}
.ntbar2 button{flex:none;position:relative;min-width:42px;height:42px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 10px;font-size:15px;font-weight:700;color:var(--ti);background:transparent;border:0;box-shadow:none;transition:background .12s,color .12s,transform .1s}
.ntbar2 button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ntbar2 button:hover{background:color-mix(in srgb,var(--ntac) 16%,transparent)}
.ntbar2 button:active{transform:scale(.92);background:color-mix(in srgb,var(--ntac) 28%,transparent)}

 vals.forEach(function(v,k){var bh=v/mx*(H-18);bars+='<rect x="'+(k*bw+bw*.14).toFixed(1)+'" y="'+(H-14-bh).toFixed(1)+'" width="'+(bw*.72).toFixed(1)+'" height="'+Math.max(bh,0).toFixed(1)+'" rx="3" fill="'+(v>st.kcal?'#ef4444':'#f97316')+'" opacity="'+(v?1:.15)+'"/>'});

 if(wpts.length>1){var lo=Math.min.apply(null,wpts.map(function(p){return p[1]}))-.5,hi=Math.max.apply(null,wpts.map(function(p){return p[1]}))+.5,pts=wpts.map(function(p){return (p[0]*bw+bw/2).toFixed(1)+','+(H-14-(p[1]-lo)/(hi-lo)*(H-26)).toFixed(1)}).join(' ');

function nuLocal(q){

}

function ntClone(p,par,map){
 var c=JSON.parse(JSON.stringify(p));c.id='np_'+uid();c.par=par;c.ord=Date.now();c.fav=0;c.tr=0;delete c.trp;c.ed=Date.now();map[p.id]=c.id;S.npg.push(c);
 S.npg.filter(function(x){return x.par===p.id&&!x.tr}).forEach(function(k){ntClone(k,c.id,map)});return c;
}
function ntMd(p){
 var out=['# '+ntTitle(p),''],n={};
 p.blocks.forEach(function(b){var t=ntTxt(b.x),ind=new Array(b.i+1).join('  ');if(b.t!=='ol')n={};
  if(b.t==='h1')out.push('# '+t);else if(b.t==='h2')out.push('## '+t);else if(b.t==='h3')out.push('### '+t);else if(b.t==='ul')out.push(ind+'- '+t);
  else if(b.t==='ol'){n[b.i]=(n[b.i]||0)+1;out.push(ind+n[b.i]+'. '+t)}else if(b.t==='td')out.push(ind+'- ['+(b.c?'x':' ')+'] '+t);else if(b.t==='tg')out.push(ind+'- '+t);
  else if(b.t==='q'||b.t==='co')out.push('> '+t);else if(b.t==='code')out.push('```\n'+b.x+'\n```');else if(b.t==='hr')out.push('---');else if(b.t==='pg'){var c=ntPg(b.ref);out.push('['+ntTitle(c)+']')}else if(b.t==='tbl'&&b.r){b.r.forEach(function(r,ri){out.push('| '+r.map(ntTxt).join(' | ')+' |');if(ri===0)out.push('|'+r.map(function(){return ' --- |'}).join(''))})}else if(b.t==='cols'&&b.c){b.c.forEach(function(c){out.push(ntTxt(c))})}else if(b.t==='img'){out.push('[image'+(b.cap?': '+ntTxt(b.cap):'')+']')}else if(b.t==='toc'){}else out.push(t);});
 return out.join('\n');
}

function nuRange(v,tg,okLo,okHi,zLo,zHi){
 if(!(tg>0))return 1;var r=v/tg;
 if(r>=okLo&&r<=okHi)return 1;
 if(r<okLo)return Math.max(0,(r-zLo)/(okLo-zLo));

}

  {k:'kcal',w:25,v:t.k,tg:st.kcal,s:nuRange(t.k,st.kcal,.92,1.1,.5,1.5)},
  {k:'p',w:25,v:t.p,tg:st.p,s:nuRange(t.p,st.p,.95,3,.4,3.1)},
  {k:'c',w:10,v:t.c,tg:st.c,s:nuRange(t.c,st.c,.8,1.2,.4,1.8)},
  {k:'f',w:10,v:t.f,tg:st.f,s:nuRange(t.f,st.f,.8,1.2,.4,1.8)},
  {k:'fi',w:10,v:t.fi,tg:st.fi,s:nuRange(t.fi,st.fi,.8,3,.2,3.1)},
  {k:'su',w:5,v:t.su,tg:maxes.su,s:nuRange(t.su,maxes.su,0,1,-1,2)},
  {k:'sf',w:5,v:t.sf,tg:maxes.sf,s:nuRange(t.sf,maxes.sf,0,1,-1,2)},
  {k:'sa',w:5,v:t.sa,tg:maxes.sa,s:nuRange(t.sa,maxes.sa,0,1,-1,2)},
  {k:'wa',w:5,v:wat,tg:wgoal,s:nuRange(wat,wgoal,.85,3,.2,3.1)}
 ];
 var sc=Math.round(comps.reduce(function(a,c){return a+c.w*c.s},0));
 var tips=[],ok=[];
 comps.forEach(function(c){
  var r=c.tg>0?c.v/c.tg:1,d=Math.round(Math.abs(c.v-c.tg));
  if(c.s>=.85){ok.push(c);return}

function onSubmit(e){
 var f=e.target.closest('[data-form]');if(!f)return;
 e.preventDefault();
 var kind=f.dataset.form,inp=f.querySelector('input');

  var t=$('#gTitle').value.trim();if(!t)return;
  S.goals.push({id:uid(),title:t,area:$('#gArea').value,due:$('#gDue').value||null,done:false,doneAt:null,ex:false});
  save();renderAll();toast('Goal added');
 }else if(kind==='step'){
  var v=inp.value.trim();if(!v)return;
  var g=S.goals.filter(function(x){return x.id===f.dataset.id})[0];if(!g)return;

  var nv=inp.value.trim();if(!nv)return;S.name=nv;save();renderAll();toast('Lovely to meet you, '+nv+'.');

  S.rewards.push({id:uid(),name:rn,cost:Math.max(1,parseInt($('#rCost').value,10)||100),ex:false});save();renderAll();toast('Reward added');

}
